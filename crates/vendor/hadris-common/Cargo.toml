[package]
name = "hadris-common"
version = "1.2.1"
edition = "2024"
authors = ["hxyulin"]
license = "MIT"
repository = "https://github.com/hxyulin/hadris"
description = "Common types and functions used by Hadris"
readme = "README.md"
keywords = ["filesystem", "endian", "crc", "iso-string"]
categories = ["no-std", "filesystem"]
include = ["src/**/*", "Cargo.toml", "LICENSE", "README.md"]
resolver = "2"

[features]
default = ["bytemuck", "std"]
sync = ["hadris-io/sync"]
async = ["hadris-io/async"]
alloc = ["hadris-io/alloc"]
std = ["sync", "dep:chrono", "chrono?/std", "dep:crc", "dep:rand", "alloc"]
bytemuck = ["dep:bytemuck"]
optical = ["alloc"]

[lib]
name = "hadris_common"
path = "src/lib.rs"

[dependencies]
bytemuck = { version = "1.22.0", features = ["derive"], optional = true, default-features = false }
zerocopy = { version = "0.8", features = ["derive"], default-features = false }
chrono = { version = "0.4.40", optional = true, default-features = false }
crc = { version = "3.2.1", optional = true }
rand = { version = "0.9.0", optional = true }
# Replaced GPL-3.0 noalloc with MIT planck-noalloc via Cargo package rename.
# The source code `use noalloc::...` remains unchanged; Cargo resolves `noalloc`
# to the `planck-noalloc` package, which provides compatible APIs.
noalloc = { package = "planck-noalloc", version = "0.1.1" }
hadris-io = { version = "1.2.1", default-features = false }

[dev-dependencies]
criterion = { version = "0.5.1" }
static_assertions = { version = "1.1.0" }
