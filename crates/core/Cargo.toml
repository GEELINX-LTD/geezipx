[package]
name = "geezipx-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
description = "Compression/decompression core engine for GeeZipX"
readme = "../../README.md"
keywords = ["compression", "decompression", "archive", "zip", "gzip"]
categories = ["compression"]

[features]
rar = ["dep:unrar"]
zpaq = ["dep:zpaq_rs"]
sfx = []
wim = []
default = ["rar", "zpaq", "wim"]

[dependencies]
thiserror = "2"
log = "0.4"
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }

tar = "0.4"
brotli = "8"
bzip2 = "0.6"
cab = "0.6"
cpio-archive = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
gzp = { version = "0.11", default-features = false, features = ["deflate_rust"] }
lz4_flex = "0.13"
lzma-rust2 = { version = "0.16", default-features = false, features = ["std", "lzip", "encoder"] }
xz2 = { version = "0.1", features = ["static"] }
zstd = { version = "0.13", features = ["zstdmt"] }
asar = { version = "0.3", default-features = false, features = ["write"] }
ar = "0.9"
delharc = "0.6"
oxiarc-lzhuf = "0.3"
isomage = "2.1"
hadris-iso = "1.1"
lzxd = "0.2"
xpress-huffman = "0.1"
sevenz-rust2 = { version = "0.21", default-features = false, features = ["compress", "aes256", "bzip2", "ppmd", "deflate"] }
# Optional: RAR read-only (feature-gated, requires C++ compiler)
unrar = { version = "0.5.8", optional = true }
# Retro archive formats (read-only via unarc-rs unified API)
unarc-rs = "0.6"
# Optional: ZPAQ read-only (feature-gated, requires Rust 1.85+ and a C++17 compiler)
zpaq_rs = { version = "1.0", optional = true }
# ALZ archive reader (git dependency, not yet published on crates.io)
unalz-rs = { git = "https://github.com/OctopusET/unalz-rs" }
# UU/UUE decode

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
asar = { version = "0.3", default-features = false, features = ["write"] }
sevenz-rust2 = { version = "0.21", default-features = false, features = ["compress", "util", "aes256", "bzip2", "ppmd", "deflate"] }

[lib]
name = "geezipx_core"
path = "src/lib.rs"

[[bench]]
name = "gzip_throughput"
harness = false

[[bench]]
name = "archive_throughput"
harness = false
