[package]
name = "geezipx-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "GeeZipX Shell launch protocol and Windows Explorer command extension"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-core = "0.61.2"
windows-registry = "0.6.1"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
