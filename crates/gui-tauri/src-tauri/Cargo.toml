[package]
name = "geezipx-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "GeeZipX Desktop GUI — Tauri v2 application"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
geezipx-core.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tauri-plugin-drag = "2.1.1"
tauri-plugin-window-state = "2"

[features]
default = ["rar", "zpaq", "wim"]
rar = ["geezipx-core/rar"]
zpaq = ["geezipx-core/zpaq"]
wim = ["geezipx-core/wim"]

[dev-dependencies]
zpaq_rs = "1.0"
tempfile = "3"

[lib]
name = "geezipx_gui_lib"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "geezipx-gui"
path = "src/main.rs"
