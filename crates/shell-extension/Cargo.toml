[package]
name = "geezipx-shell-extension"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "GeeZipX Windows Shell Extension — IExplorerCommand COM DLL for modern context menu (experimental PoC)"

[lib]
name = "geezipx_shell_extension"
crate-type = ["cdylib"]

[target.'cfg(target_os = "windows")'.dependencies]
paste = "1"
windows = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
] }
windows-core = "0.61"
windows-registry = "0.6.1"
windows-result = "0.4"
