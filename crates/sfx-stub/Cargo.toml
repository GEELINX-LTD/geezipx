[package]
name = "geezipx-sfx-stub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Minimal self-extracting ZIP stub for GeeZipX"

[[bin]]
name = "sfx-stub"
path = "src/main.rs"

[dependencies]
cap-std = "4"
zip = { workspace = true, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
