[package]
name = "geezipx-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "GeeZipX native desktop archive manager powered by egui"

[features]
default = ["rar"]
rar = ["geezipx-core/rar"]
zpaq = ["geezipx-core/zpaq"]

[dependencies]
geezipx-core.workspace = true
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11", "persistence"] }
rfd = "0.16"
open = "5"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
same-file = "1"
raw-window-handle = "0.6"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
drag = "2.1.1"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
x11-dl = "2.21"
url = "2"

[[bin]]
name = "geezipx-egui"
path = "src/main.rs"
