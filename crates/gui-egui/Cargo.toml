[package]
name = "geezipx-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "GeeZipX native desktop archive manager powered by egui"

[features]
default = ["rar"]
rar = ["geezipx-core/rar"]
zpaq = ["geezipx-core/zpaq"]

[dependencies]
geezipx-core.workspace = true
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11", "persistence"] }
rfd = "0.16"
open = "5"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
same-file = "1"
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.61.2"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Com_Urlmon", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFilePromiseProvider", "NSGraphicsContext", "NSImage", "NSPasteboard", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSOperation", "NSString", "NSURL"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
x11-dl = "2.21"
url = "2"

[[bin]]
name = "geezipx-egui"
path = "src/main.rs"
