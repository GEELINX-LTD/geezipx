# cargo-deny configuration
# See https://embarkstudios.github.io/cargo-deny/ for details

[advisories]
unmaintained = "workspace"
yanked = "warn"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "MIT-0",
    "MPL-2.0",
]

[[licenses.exceptions]]
name = "xxhash-rust"
allow = ["BSL-1.0"]

# egui's Windows clipboard backend; permissive Boost Software License.
[[licenses.exceptions]]
name = "clipboard-win"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
name = "error-code"
allow = ["BSL-1.0"]

# egui's bundled fonts; redistribution notices are shipped in gui-egui/assets.
[[licenses.exceptions]]
name = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
