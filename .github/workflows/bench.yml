name: Benchmark

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bench_filter:
        description: 'Benchmark filter (optional, e.g. "gzip/compress")'
        type: string
        required: false
        default: ''
      max_regression_percent:
        description: 'Fail if Criterion mean regression exceeds this percent'
        type: string
        required: false
        default: '10'
      require_comparison:
        description: 'Fail if Criterion comparison data is missing'
        type: boolean
        required: false
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - name: Run benchmarks
        run: |
          if [ -n "${{ github.event.inputs.bench_filter }}" ]; then
            cargo bench -p geezipx-core -- "${{ github.event.inputs.bench_filter }}"
          else
            cargo bench -p geezipx-core
          fi
      - name: Check benchmark regression threshold
        if: github.event_name == 'workflow_dispatch'
        env:
          GEEZIPX_BENCH_MAX_REGRESSION_PERCENT: ${{ inputs.max_regression_percent }}
          GEEZIPX_BENCH_REQUIRE_COMPARISON: ${{ inputs.require_comparison }}
        run: bash scripts/check-bench-regression.sh
      - uses: actions/upload-artifact@v7
        with:
          name: criterion-report
          path: target/criterion/
          retention-days: 30
          if-no-files-found: error
