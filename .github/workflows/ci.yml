name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  doc:
    needs: fmt
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - run: cargo doc --workspace --exclude geezipx-gui --no-deps --document-private-items

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          cache: true
      - run: cargo fmt --all --check
      - name: Check maintained ZPAQ support library formatting
        run: cargo fmt --manifest-path crates/vendor/zpaq-rs/Cargo.toml --check
      - name: Check maintained LZH support library formatting
        run: cargo fmt --manifest-path crates/vendor/oxiarc-lzhuf/Cargo.toml --check
      - name: Check maintained NSIS support library formatting
        run: cargo fmt --manifest-path crates/vendor/nsis/Cargo.toml --check

  gui-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/gui-tauri/package-lock.json
      - working-directory: crates/gui-tauri
        run: npm ci
      - working-directory: crates/gui-tauri
        run: npm test
      - working-directory: crates/gui-tauri
        run: npx tsc --noEmit
      - working-directory: crates/gui-tauri
        run: npm run build

  clippy:
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
          cache: true
      - name: Use static CRT on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV
      - name: Minimal CLI feature build
        if: runner.os == 'Linux'
        run: cargo check -p geezipx --no-default-features
      - name: Clippy (macOS, exclude zpaq for LLVM compat)
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --exclude geezipx-gui --all-targets --no-default-features -F rar,wim,sfx -- -D warnings
      - name: Clippy (Linux / Windows)
        if: runner.os != 'macOS'
        run: cargo clippy --workspace --exclude geezipx-gui --all-targets --all-features -- -D warnings

  test:
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            stub_target: linux-x86_64
            stub_binary: sfx-stub
          - os: macos-15-intel
            stub_target: macos-x86_64
            stub_binary: sfx-stub
          - os: windows-latest
            stub_target: windows-x86_64
            stub_binary: sfx-stub.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - name: Use static CRT on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV
      - name: Build SFX stub
        shell: bash
        run: |
          cargo build -p geezipx-sfx-stub --release
          mkdir -p crates/core/stubs/${{ matrix.stub_target }}
          cp target/release/${{ matrix.stub_binary }} crates/core/stubs/${{ matrix.stub_target }}/${{ matrix.stub_binary }}
      - name: Test maintained ZPAQ support library
        if: runner.os == 'Linux'
        run: cargo test --manifest-path crates/vendor/zpaq-rs/Cargo.toml
      - name: Test maintained LZH support library
        if: runner.os == 'Linux'
        run: cargo test --manifest-path crates/vendor/oxiarc-lzhuf/Cargo.toml --lib
      - name: Test maintained NSIS support library
        if: runner.os == 'Linux'
        run: cargo test --manifest-path crates/vendor/nsis/Cargo.toml
      - name: Test minimal core/CLI features
        run: cargo test --locked -p geezipx-core -p geezipx --no-default-features
      - name: Test default core/CLI features (Linux / Windows)
        if: runner.os != 'macOS'
        run: cargo test --locked -p geezipx-core -p geezipx
      - name: Test base core/CLI features (macOS, RAR/SFX without ZPAQ)
        if: runner.os == 'macOS'
        run: cargo test --locked -p geezipx-core -p geezipx --no-default-features -F rar,sfx
      - name: Test (macOS, exclude zpaq for LLVM compat)
        if: runner.os == 'macOS'
        run: cargo test --locked --workspace --exclude geezipx-gui --no-default-features -F rar,wim,sfx
      - name: Test (Linux / Windows)
        if: runner.os != 'macOS'
        run: cargo test --locked --workspace --exclude geezipx-gui --all-features

  build:
    needs: [fmt, clippy, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: geezipx-linux-x86_64
            path: target/release/geezipx
            stub_target: linux-x86_64
            stub_binary: sfx-stub
            features: --all-features
          - os: macos-15-intel
            artifact: geezipx-macos-x86_64
            path: target/release/geezipx
            stub_target: macos-x86_64
            stub_binary: sfx-stub
            features: --no-default-features --features rar,wim,sfx
          - os: windows-latest
            artifact: geezipx-windows-x86_64
            path: target/release/geezipx.exe
            stub_target: windows-x86_64
            stub_binary: sfx-stub.exe
            features: --all-features
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - name: Use static CRT on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV
      - name: Build SFX stub
        shell: bash
        run: |
          cargo build -p geezipx-sfx-stub --release
          mkdir -p crates/core/stubs/${{ matrix.stub_target }}
          cp target/release/${{ matrix.stub_binary }} crates/core/stubs/${{ matrix.stub_target }}/${{ matrix.stub_binary }}
          echo "${{ matrix.stub_target }} stub: $(stat -c%s crates/core/stubs/${{ matrix.stub_target }}/${{ matrix.stub_binary }} 2>/dev/null || stat -f%z crates/core/stubs/${{ matrix.stub_target }}/${{ matrix.stub_binary }} 2>/dev/null || echo '?') bytes"
      - name: Build native CLI candidate
        run: cargo build --locked --release -p geezipx ${{ matrix.features }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify native formats and SFX
        id: acceptance
        env:
          GEEZIPX_CANDIDATE_FEATURES: ${{ matrix.features }}
        run: python scripts/check-format-candidate.py --binary ${{ matrix.path }} --sfx --report candidate-report.json
      - name: Upload native acceptance report
        if: ${{ !cancelled() && steps.acceptance.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-acceptance
          path: candidate-report.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7

  sfx-e2e:
    needs: [fmt, clippy, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - name: Build SFX stub and CLI
        run: |
          cargo build -p geezipx-sfx-stub --release
          mkdir -p crates/core/stubs/linux-x86_64
          cp target/release/sfx-stub crates/core/stubs/linux-x86_64/sfx-stub
          cargo build --release -p geezipx
      - name: Create test data
        run: |
          mkdir -p testdata/subdir
          echo "hello sfx world" > testdata/file1.txt
          echo "nested content" > testdata/subdir/nested.txt
      - name: Create SFX archive
        run: |
          (cd testdata && ../target/release/geezipx compress . -o ../test.sfx --sfx --recursive)
          chmod +x test.sfx
          echo "SFX binary size: $(stat -c%s test.sfx) bytes"
      - name: Run SFX and verify extraction
        run: |
          mkdir -p sfx-out
          cd sfx-out
          ../test.sfx
          test -f testdata/file1.txt && echo "file1.txt extracted OK"
          test -f testdata/subdir/nested.txt && echo "subdir/nested.txt extracted OK"
          grep -q "hello sfx world" testdata/file1.txt && echo "file1.txt content OK"
          grep -q "nested content" testdata/subdir/nested.txt && echo "nested.txt content OK"

  interop:
    needs: [clippy, test, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - run: bash scripts/check-interop.sh

  streaming-smoke:
    needs: [clippy, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - run: cargo test -p geezipx --test streaming_smoke -- --test-threads=1 --ignored

  bench-compile:
    needs: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - run: cargo bench --no-run -p geezipx-core

  bench-regression:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - name: Download benchmark baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/setup-bench-baseline.sh
      - name: Run benchmarks
        run: cargo bench -p geezipx-core
      - name: Check benchmark regression
        continue-on-error: true
        run: bash scripts/check-bench-regression.sh
