name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  doc:
    needs: fmt
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - run: cargo doc --workspace --exclude geezipx-gui --no-deps --document-private-items

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          cache: true
      - run: cargo fmt --all --check

  clippy:
    needs: fmt
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
          cache: true
      - name: Use static CRT on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV
      - run: cargo clippy --workspace --exclude geezipx-gui --all-targets --all-features -- -D warnings

  test:
    needs: fmt
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            stub_target: linux-x86_64
            stub_binary: sfx-stub
          - os: macos-latest
            stub_target: macos-x86_64
            stub_binary: sfx-stub
          - os: windows-latest
            stub_target: windows-x86_64
            stub_binary: sfx-stub.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - name: Use static CRT on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV
      - name: Build SFX stub
        shell: bash
        run: |
          cargo build -p geezipx-sfx-stub --release
          mkdir -p crates/core/stubs/${{ matrix.stub_target }}
          cp target/release/${{ matrix.stub_binary }} crates/core/stubs/${{ matrix.stub_target }}/${{ matrix.stub_binary }}
      - run: cargo test --workspace --exclude geezipx-gui --all-features

  build:
    needs: [fmt, clippy, test]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: geezipx-linux-x86_64
            path: target/release/geezipx
            stub_target: linux-x86_64
            stub_binary: sfx-stub
          - os: macos-latest
            artifact: geezipx-macos-x86_64
            path: target/release/geezipx
            stub_target: macos-x86_64
            stub_binary: sfx-stub
          - os: windows-latest
            artifact: geezipx-windows-x86_64
            path: target/release/geezipx.exe
            stub_target: windows-x86_64
            stub_binary: sfx-stub.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - name: Use static CRT on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV
      - name: Build SFX stub
        shell: bash
        run: |
          cargo build -p geezipx-sfx-stub --release
          mkdir -p crates/core/stubs/${{ matrix.stub_target }}
          cp target/release/${{ matrix.stub_binary }} crates/core/stubs/${{ matrix.stub_target }}/${{ matrix.stub_binary }}
          echo "${{ matrix.stub_target }} stub: $(stat -c%s crates/core/stubs/${{ matrix.stub_target }}/${{ matrix.stub_binary }} 2>/dev/null || stat -f%z crates/core/stubs/${{ matrix.stub_target }}/${{ matrix.stub_binary }} 2>/dev/null || echo '?') bytes"
      - run: cargo build --release --workspace --exclude geezipx-gui
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7

  sfx-e2e:
    needs: [fmt, clippy, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - name: Build SFX stub and CLI
        run: |
          cargo build -p geezipx-sfx-stub --release
          mkdir -p crates/core/stubs/linux-x86_64
          cp target/release/sfx-stub crates/core/stubs/linux-x86_64/sfx-stub
          cargo build --release -p geezipx
      - name: Create test data
        run: |
          mkdir -p testdata/subdir
          echo "hello sfx world" > testdata/file1.txt
          echo "nested content" > testdata/subdir/nested.txt
      - name: Create SFX archive
        run: |
          ./target/release/geezipx compress testdata -o test.sfx --sfx
          chmod +x test.sfx
          echo "SFX binary size: $(stat -c%s test.sfx) bytes"
      - name: Run SFX and verify extraction
        run: |
          mkdir -p sfx-out
          cd sfx-out
          ../test.sfx
          test -f file1.txt && echo "file1.txt extracted OK"
          test -f subdir/nested.txt && echo "subdir/nested.txt extracted OK"
          grep -q "hello sfx world" file1.txt && echo "file1.txt content OK"
          grep -q "nested content" subdir/nested.txt && echo "nested.txt content OK"

  interop:
    needs: [clippy, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - run: bash scripts/check-interop.sh

  streaming-smoke:
    needs: [clippy, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - run: cargo test -p geezipx --test streaming_smoke -- --test-threads=1 --ignored

  bench-compile:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - run: cargo bench --no-run -p geezipx-core

  bench-regression:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - name: Download benchmark baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/setup-bench-baseline.sh
      - name: Run benchmarks
        run: cargo bench -p geezipx-core
      - name: Check benchmark regression
        continue-on-error: true
        run: bash scripts/check-bench-regression.sh
