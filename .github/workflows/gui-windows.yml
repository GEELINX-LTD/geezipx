name: GUI Windows Build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-gui:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: crates/gui-tauri

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/gui-tauri/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Build Tauri GUI (Windows)
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Upload Windows GUI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: geezipx-gui-windows-x86_64
          path: |
            target/release/geezipx-gui.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 30
