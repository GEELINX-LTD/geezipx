name: GUI Windows Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/gui-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/gui-windows.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-gui:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: crates/gui-tauri

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Use static CRT on Windows
        shell: pwsh
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/gui-tauri/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Rust tests (GUI lib — shell menu, COM, action file)
        shell: pwsh
        run: cargo test -p geezipx-gui --lib
        working-directory: .

      - name: Build Tauri GUI (Windows)
        run: npm run tauri build -- --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Upload Windows GUI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: geezipx-gui-windows-x86_64
          path: |
            target/release/geezipx-gui.exe
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
