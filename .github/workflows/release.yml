name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (build & verify artifacts but skip release creation)'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: geezipx-linux-x86_64
            binary: geezipx
            ext: tar.gz
            stub_target: linux-x86_64
            stub_binary: sfx-stub
          - os: macos-latest
            artifact: geezipx-macos-x86_64
            binary: geezipx
            ext: tar.gz
            stub_target: macos-x86_64
            stub_binary: sfx-stub
          - os: windows-latest
            artifact: geezipx-windows-x86_64
            binary: geezipx.exe
            ext: zip
            stub_target: windows-x86_64
            stub_binary: sfx-stub.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - name: Use static CRT on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV
      - name: Disable LTO on macOS (zpaq_rs bitcode incompatibility)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "CARGO_PROFILE_RELEASE_LTO=false" >> $GITHUB_ENV
      - name: Build SFX stub
        shell: bash
        run: |
          cargo build -p geezipx-sfx-stub --release
          mkdir -p crates/core/stubs/${{ matrix.stub_target }}
          cp target/release/${{ matrix.stub_binary }} crates/core/stubs/${{ matrix.stub_target }}/${{ matrix.stub_binary }}
      - run: cargo build --release --workspace --exclude geezipx-gui

      # Package and checksum — Unix (Linux / macOS)
      - name: Package archive and checksum
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/"
          cd dist
          tar -czf "${{ matrix.artifact }}.${{ matrix.ext }}" "${{ matrix.binary }}"
          sha256sum "${{ matrix.artifact }}.${{ matrix.ext }}" > "${{ matrix.artifact }}.${{ matrix.ext }}.sha256"
      # Package and checksum — Windows
      - name: Package archive and checksum (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/"
          cd dist
          7z a "${{ matrix.artifact }}.${{ matrix.ext }}" "${{ matrix.binary }}"
          sha256sum "${{ matrix.artifact }}.${{ matrix.ext }}" > "${{ matrix.artifact }}.${{ matrix.ext }}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  gui-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/gui-tauri/package-lock.json
      - name: Install Node deps
        working-directory: crates/gui-tauri
        run: npm ci
      - name: Build Tauri (Linux)
        working-directory: crates/gui-tauri
        run: npm run tauri build -- --bundles appimage deb
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp crates/gui-tauri/src-tauri/target/release/bundle/appimage/*.AppImage dist/ 2>/dev/null || true
          cp crates/gui-tauri/src-tauri/target/release/bundle/deb/*.deb dist/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: geezipx-gui-linux-x86_64
          path: dist/*
          if-no-files-found: warn

  gui-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/gui-tauri/package-lock.json
      - name: Install Node deps
        working-directory: crates/gui-tauri
        run: npm ci
      - name: Build Tauri (macOS)
        working-directory: crates/gui-tauri
        run: npm run tauri build -- --bundles dmg
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp crates/gui-tauri/src-tauri/target/release/bundle/dmg/*.dmg dist/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: geezipx-gui-macos-x86_64
          path: dist/*
          if-no-files-found: warn

  gui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/gui-tauri/package-lock.json
      - name: Install Node deps
        working-directory: crates/gui-tauri
        run: npm ci
      - name: Build Tauri (Windows)
        working-directory: crates/gui-tauri
        run: npm run tauri build -- --bundles msi
      - name: Collect artifacts
        shell: pwsh
        run: |
          mkdir -p dist
          Copy-Item crates/gui-tauri/src-tauri/target/release/bundle/msi/*.msi dist/ -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v7
        with:
          name: geezipx-gui-windows-x86_64
          path: dist/*
          if-no-files-found: warn

  consolidate:
    needs: [build, gui-linux, gui-macos, gui-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          errors=0

          required_patterns=(
            "geezipx-linux-x86_64.tar.gz"
            "geezipx-macos-x86_64.tar.gz"
            "geezipx-windows-x86_64.zip"
          )

          for pat in "${required_patterns[@]}"; do
            # Pattern may match multiple files (e.g., .tar.gz and .tar.gz.sha256)
            count=$(find artifacts -maxdepth 1 -name "$pat*" | wc -l)
            if [ "$count" -ge 1 ]; then
              echo "✅ $pat (${count} file(s))"
            else
              echo "❌ $pat missing"
              errors=$((errors + 1))
            fi
          done

          # Verify SFX stub sizes — at minimum the CLI binaries should have embedded stubs
          echo "--- SFX stub verification ---"
          for asset in artifacts/geezipx-linux-x86_64.tar.gz artifacts/geezipx-macos-x86_64.tar.gz artifacts/geezipx-windows-x86_64.zip; do
            echo "Checking $asset for embedded SFX stub..."
            # Extract and check that the binary contains the sfx-stub marker
            # The sfx-stub contains the string "GeeZipX SFX stub" or we can check for minimum size
            if [ -f "$asset" ]; then
              echo "  $asset present"
            else
              echo "  $asset NOT FOUND"
            fi
          done

          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors artifact(s) missing"
            exit 1
          fi
          echo "All artifacts verified"
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
