name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (build & verify artifacts but skip release creation)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
      production_signing: ${{ steps.plan.outputs.production_signing }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify release routing
        run: python3 -m unittest discover -s scripts -p 'test_release_plan.py'
      - name: Plan beta, stable or dry-run build
        id: plan
        run: python3 scripts/release_plan.py

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: geezipx-linux-x86_64
            binary: geezipx
            ext: tar.gz
            stub_target: linux-x86_64
            stub_binary: sfx-stub
          - os: macos-15-intel
            artifact: geezipx-macos-x86_64
            binary: geezipx
            ext: tar.gz
            stub_target: macos-x86_64
            stub_binary: sfx-stub
          - os: windows-latest
            artifact: geezipx-windows-x86_64
            binary: geezipx.exe
            ext: zip
            stub_target: windows-x86_64
            stub_binary: sfx-stub.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.99.0"
          cache: true
      - name: Use static CRT on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV
      - name: Disable LTO on macOS (zpaq_rs bitcode incompatibility)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "CARGO_PROFILE_RELEASE_LTO=false" >> $GITHUB_ENV
      - name: Build SFX stub
        shell: bash
        run: |
          cargo build -p geezipx-sfx-stub --release --locked
          mkdir -p crates/core/stubs/${{ matrix.stub_target }}
          cp target/release/${{ matrix.stub_binary }} crates/core/stubs/${{ matrix.stub_target }}/${{ matrix.stub_binary }}
      - name: Build CLI (macOS, exclude zpaq for LLVM compat)
        if: runner.os == 'macOS'
        run: cargo build --release --locked -p geezipx --no-default-features -F rar,wim,sfx
      - name: Build CLI (Linux / Windows)
        if: runner.os != 'macOS'
        run: cargo build --release --locked -p geezipx

      - name: Verify native SFX
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          cli_binary="$PWD/target/release/${{ matrix.binary }}"
          sfx_check_dir=$(mktemp -d)
          trap 'rm -rf "$sfx_check_dir"' EXIT
          (
            cd "$sfx_check_dir"
            printf 'GeeZipX native SFX verification\n' > input.txt
            "$cli_binary" compress input.txt -f zip -o check.exe --sfx
            ./check.exe extracted
            cmp input.txt extracted/input.txt
          )

      - name: Package archive and checksum
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/"
          cd dist
          tar -czf "${{ matrix.artifact }}.${{ matrix.ext }}" "${{ matrix.binary }}"
          sha256sum "${{ matrix.artifact }}.${{ matrix.ext }}" > "${{ matrix.artifact }}.${{ matrix.ext }}.sha256"
      - name: Package archive and checksum (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/"
          cd dist
          7z a "${{ matrix.artifact }}.${{ matrix.ext }}" "${{ matrix.binary }}"
          sha256sum "${{ matrix.artifact }}.${{ matrix.ext }}" > "${{ matrix.artifact }}.${{ matrix.ext }}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-release
          path: |
            dist/*.${{ matrix.ext }}
            dist/*.sha256
          if-no-files-found: error

  gui:
    needs: prepare
    uses: ./.github/workflows/gui-egui.yml
    with:
      production_signing: ${{ needs.prepare.outputs.production_signing == 'true' }}
    secrets:
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

  consolidate:
    needs: [prepare, build, gui]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: geezipx-*-release
          path: artifacts
          merge-multiple: true
      - name: Verify artifacts and generate checksums
        shell: bash
        run: bash scripts/verify-release-artifacts.sh artifacts
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: geezipx-release-artifacts
          path: artifacts/*
          if-no-files-found: error
      - name: Write beta release introduction
        if: needs.prepare.outputs.prerelease == 'true'
        env:
          BETA_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          run = os.environ['GITHUB_RUN_ID']
          tag = os.environ['BETA_TAG']
          Path('beta-notes.md').write_text(
              f'Automatic development beta **{tag}**.\n\n'
              f'Source: [{sha}](https://github.com/{repo}/commit/{sha})\n'
              f'Build: https://github.com/{repo}/actions/runs/{run}\n\n'
              'Includes Linux/Windows x86_64 and macOS x86_64 CLI archives, '
              'Linux/Windows x86_64 and macOS arm64 GUI archives, the Windows '
              'NSIS installer, and SHA-256 checksums.\n\n'
              'Windows beta builds use a test signing certificate. To enable the '
              'Windows 11 primary context menu, select it during setup and review '
              'the optional certificate prompt. Certificate import requests '
              'administrator permission; archive operations remain available '
              'without importing it. Uninstall defaults to removing certificates '
              'added by setup.\n\n', encoding='utf-8')
          PY
      - name: Create release draft with verified assets
        id: release
        if: needs.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.tag }}
          files: artifacts/*
          draft: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'true' && 'false' || 'legacy' }}
          body_path: ${{ needs.prepare.outputs.prerelease == 'true' && 'beta-notes.md' || '' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Publish complete beta without changing latest stable
        if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > release-assets.json
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          expected = {p.name: p for p in Path('artifacts').iterdir() if p.is_file()}
          uploaded = {a['name']: a for page in json.loads(Path('release-assets.json').read_text()) for a in page}
          if expected.keys() != uploaded.keys():
              raise SystemExit('Release assets do not match the verified artifact set')
          for name, path in expected.items():
              asset = uploaded[name]
              if asset['state'] != 'uploaded' or asset['size'] != path.stat().st_size:
                  raise SystemExit(f'Incomplete uploaded asset: {name}')
              digest = asset.get('digest')
              if digest:
                  with path.open('rb') as source:
                      actual = 'sha256:' + hashlib.file_digest(source, 'sha256').hexdigest()
                  if digest != actual:
                      raise SystemExit(f'Uploaded asset digest mismatch: {name}')
          print(f'Confirmed {len(expected)} uploaded beta assets before publication')
          PY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F prerelease=true -f make_latest=false \
            --jq '.html_url' >> "$GITHUB_STEP_SUMMARY"
