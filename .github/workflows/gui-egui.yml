name: egui Desktop

on:
  push:
    branches: [main]
    paths:
      - 'crates/gui-egui/**'
      - 'crates/shell/**'
      - 'crates/core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/*egui-windows-*.ps1'
      - '.github/workflows/gui-egui.yml'
  pull_request:
    paths:
      - 'crates/gui-egui/**'
      - 'crates/shell/**'
      - 'crates/core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/*egui-windows-*.ps1'
      - '.github/workflows/gui-egui.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      production_signing:
        type: boolean
        default: false
    secrets:
      WINDOWS_CERTIFICATE_PFX:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-egui-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            suffix: ''
            archive_ext: tar.gz
            test_features: '--all-features'
          - os: windows-latest
            platform: windows-x86_64
            suffix: '.exe'
            archive_ext: zip
            test_features: '--all-features'
          - os: macos-latest
            platform: macos-arm64
            suffix: ''
            archive_ext: tar.gz
            test_features: '--all-features'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.99.0"
          components: clippy
          cache: true
      - name: Configure Windows shell signing identity
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GEEZIPX_WINDOWS_CERTIFICATE_PFX: ${{ inputs.production_signing && secrets.WINDOWS_CERTIFICATE_PFX || '' }}
          GEEZIPX_WINDOWS_CERTIFICATE_PASSWORD: ${{ inputs.production_signing && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: |
          if ('${{ inputs.production_signing }}' -eq 'true') {
            ./scripts/configure-egui-windows-signing.ps1
          } else {
            ./scripts/configure-egui-windows-signing.ps1 -TestCertificate
          }
      - name: Match Windows static C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=$env:RUSTFLAGS -C target-feature=+crt-static" >> $env:GITHUB_ENV'
      - name: Avoid cross-language C++ LTO
        if: runner.os != 'Windows'
        run: echo 'CXXFLAGS=-fno-lto' >> "$GITHUB_ENV"
      - name: Refresh embedded SFX stub
        shell: bash
        run: |
          case '${{ runner.os }}' in
            Linux)
              cargo build -p geezipx-sfx-stub --release --locked
              cp target/release/sfx-stub crates/core/stubs/linux-x86_64/sfx-stub
              ;;
            Windows)
              cargo build -p geezipx-sfx-stub --release --locked
              cp target/release/sfx-stub.exe crates/core/stubs/windows-x86_64/sfx-stub.exe
              ;;
            macOS)
              rustup target add x86_64-apple-darwin
              cargo build -p geezipx-sfx-stub --release --target x86_64-apple-darwin --locked
              cp target/x86_64-apple-darwin/release/sfx-stub crates/core/stubs/macos-x86_64/sfx-stub
              ;;
          esac
      - name: Check native frontend
        run: cargo clippy -p geezipx-egui -p geezipx-shell --all-targets ${{ matrix.test_features }} --locked -- -D warnings
      - name: Test archive operations and shell commands
        run: cargo test -p geezipx-egui -p geezipx-shell ${{ matrix.test_features }} --locked
      - name: Build standalone native frontend
        run: cargo build -p geezipx-egui --release --locked
      - name: Build and sign Windows Explorer package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p geezipx-shell --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Shell extension build failed' }
          ./scripts/build-egui-windows-shell.ps1
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path $nsis)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          if (-not (Test-Path $nsis)) { throw 'makensis.exe not found' }
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $version = ($metadata.packages | Where-Object name -eq 'geezipx-egui').version
          if (-not $version) { throw 'Native GUI version not found' }
          $output = Join-Path $env:GITHUB_WORKSPACE 'target/release/bundle/egui-nsis'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & $nsis /WX /INPUTCHARSET UTF8 "/DREPO_ROOT=$env:GITHUB_WORKSPACE" "/DOUTPUT_DIR=$output" "/DAPP_VERSION=$version" "/DAPP_REVISION=$env:GITHUB_SHA" crates/gui-egui/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS packaging failed' }
          $installer = Join-Path $output "GeeZipX-Native_${version}_x64-setup.exe"
          if (-not (Test-Path $installer)) { throw 'Windows installer missing' }
          if (Test-Path target/release/GeeZipXShell-test.cer) { Copy-Item target/release/GeeZipXShell-test.cer $output }
          $build = @{
            version = $version
            commit = $env:GITHUB_SHA
            shellPublisher = $env:GEEZIPX_SHELL_PUBLISHER
            testSigning = $env:GEEZIPX_SHELL_TEST_SIGNING -eq '1'
            architecture = 'x86_64'
            installer = Split-Path $installer -Leaf
          }
          $build | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $output 'build-info.json')
          Get-ChildItem $output -Filter '*.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii (Join-Path $output 'SHA256SUMS.txt')
      - name: Verify Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem target/release/bundle/egui-nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer' }
          $installer = $installers[0]
          $installDir = Join-Path $env:RUNNER_TEMP 'GeeZipX Native 安装测试'
          $result = Start-Process $installer.FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer failed: $($result.ExitCode)" }
          $exe = Join-Path $installDir 'geezipx-egui.exe'
          $expected = (Get-FileHash target/release/geezipx-egui.exe -Algorithm SHA256).Hash
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $expected) { throw 'Installed executable differs from build' }
          foreach ($file in @('geezipx_shell.dll', 'GeeZipXShell.msix')) {
            if ((Get-FileHash (Join-Path $installDir $file) -Algorithm SHA256).Hash -ne (Get-FileHash "target/release/$file" -Algorithm SHA256).Hash) { throw "Installed shell file differs: $file" }
          }
          foreach ($file in @('LICENSE', 'build-info.txt', 'licenses/EGUI-FONTS-LICENSES.txt', 'licenses/FONT-LICENSE.txt', 'licenses/FONT-NOTICE.txt')) {
            if (-not (Test-Path (Join-Path $installDir $file))) { throw "Installed file missing: $file" }
          }
          if (-not (Select-String -Path (Join-Path $installDir 'build-info.txt') -SimpleMatch $env:GITHUB_SHA -Quiet)) { throw 'Installed build revision differs from run' }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\GeeZipXNative'
          if ((Get-ItemProperty $key).InstallLocation -ne $installDir) { throw 'Uninstall registration missing' }
          $shortcutDir = Join-Path ([Environment]::GetFolderPath('Programs')) 'GeeZipX Native'
          if (-not (Test-Path (Join-Path $shortcutDir 'GeeZipX Native.lnk'))) { throw 'Start menu shortcut missing' }
          # Hosted Windows runners may expose only the legacy OpenGL driver.
          # Keep the pinned software renderer local to this acceptance install.
          $mesaArchive = Join-Path $env:RUNNER_TEMP 'mesa3d-26.2.5-release-msvc.7z'
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.5/mesa3d-26.2.5-release-msvc.7z' -OutFile $mesaArchive
          if ((Get-FileHash $mesaArchive -Algorithm SHA256).Hash -ne '997123ef4ce8896204ab912d5b54f19372c487ff9835bcefafa2fca23b8953c2') { throw 'Mesa checksum mismatch' }
          $mesaDir = Join-Path $env:RUNNER_TEMP 'geezipx-mesa'
          & 7z x $mesaArchive "-o$mesaDir" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          $mesaDlls = @(Get-ChildItem (Join-Path $mesaDir 'x64') -Filter '*.dll' -File)
          if ($mesaDlls.Name -notcontains 'opengl32.dll') { throw 'Mesa OpenGL runtime missing' }
          try {
            foreach ($dll in $mesaDlls) { Copy-Item -LiteralPath $dll.FullName -Destination $installDir }
            $env:LIBGL_ALWAYS_SOFTWARE = 'true'
            $env:GALLIUM_DRIVER = 'llvmpipe'
            ./scripts/test-egui-windows-integration.ps1 -Exe $exe
            $upgrade = Start-Process $installer.FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
            if ($upgrade.ExitCode -ne 0) { throw "Upgrade failed: $($upgrade.ExitCode)" }
            ./scripts/test-egui-windows-integration.ps1 -Exe $exe
          } finally {
            foreach ($dll in $mesaDlls) { Remove-Item -LiteralPath (Join-Path $installDir $dll.Name) -Force -ErrorAction SilentlyContinue }
          }
          $keep = Join-Path $installDir 'keep-user-file.txt'
          Set-Content -Path $keep -Value 'Preserve unrelated files'
          $result = Start-Process (Join-Path $installDir 'uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Uninstaller failed: $($result.ExitCode)" }
          if ((Test-Path $exe) -or (Test-Path (Join-Path $installDir 'geezipx_shell.dll')) -or (Test-Path (Join-Path $installDir 'GeeZipXShell.msix')) -or (Test-Path $key) -or (Test-Path $shortcutDir)) { throw 'Uninstall did not clean application files and registration' }
          if (-not (Test-Path $keep)) { throw 'Uninstall removed an unrelated file' }
          ./scripts/test-egui-windows-integration.ps1 -Exe $exe -Uninstalled
          'Verified per-user install, licenses, revision, shortcuts, file associations, COM selection and uninstall.' >> $env:GITHUB_STEP_SUMMARY
      - name: Package native release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-package/licenses release-dist
          cp target/release/geezipx-egui${{ matrix.suffix }} release-package/
          cp LICENSE NOTICE.md release-package/
          cp crates/gui-egui/assets/*.txt release-package/licenses/
          printf 'Commit: %s\nPlatform: %s\n' "$GITHUB_SHA" '${{ matrix.platform }}' > release-package/build-info.txt
          archive="geezipx-egui-${{ matrix.platform }}.${{ matrix.archive_ext }}"
          if [ '${{ runner.os }}' = Windows ]; then
            cp target/release/geezipx_shell.dll target/release/GeeZipXShell.msix release-package/
            if [ -f target/release/GeeZipXShell-test.cer ]; then cp target/release/GeeZipXShell-test.cer release-package/; fi
            (cd release-package && 7z a "../release-dist/$archive" ./*)
            cp target/release/bundle/egui-nsis/*-setup.exe release-dist/
          else
            tar -czf "release-dist/$archive" -C release-package .
          fi
          (cd release-dist && for asset in *; do sha256sum "$asset" > "$asset.sha256"; done)
      - name: Upload native release archives
        uses: actions/upload-artifact@v7
        with:
          name: geezipx-egui-${{ matrix.platform }}-release
          if-no-files-found: error
          path: release-dist/*
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: geezipx-egui-windows-x86_64-installer
          if-no-files-found: error
          retention-days: 30
          path: target/release/bundle/egui-nsis/*
      - uses: actions/upload-artifact@v7
        with:
          name: geezipx-egui-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            target/release/geezipx-egui${{ matrix.suffix }}
            target/release/geezipx_shell.dll
            target/release/GeeZipXShell.msix
            target/release/GeeZipXShell-test.cer
            crates/gui-egui/assets/*.txt
            docs/EGUI_GUI.md
            LICENSE
