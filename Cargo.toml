[workspace]
resolver = "2"
default-members = ["crates/core", "crates/cli"]
# Maintained upstream fork; validate/package independently of the application workspace.
exclude = ["crates/vendor/hadris-iso", "crates/vendor/hadris-udf"]
members = [
    "crates/core",
    "crates/cli",
    "crates/gui-tauri/src-tauri",
    "crates/gui-egui",
    "crates/sfx-stub",
    "crates/vendor/unrar-sys",
]

[workspace.package]
version = "0.7.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/GEELINX-LTD/geezipx"
documentation = "https://github.com/GEELINX-LTD/geezipx#readme"
homepage = "https://github.com/GEELINX-LTD/geezipx"
rust-version = "1.96"

[workspace.dependencies]
geezipx-core = { version = "0.7.4", path = "crates/core", default-features = false }
zip = { version = "9.1.3", default-features = false }

[profile.release.package.geezipx-sfx-stub]
opt-level = "z"
strip = true
codegen-units = 1

[patch.crates-io]
unrar_sys = { path = "crates/vendor/unrar-sys" }
hadris-common = { path = "crates/vendor/hadris-common" }