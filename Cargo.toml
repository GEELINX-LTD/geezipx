[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/geezipx/geezipx"
rust-version = "1.96"

[workspace.dependencies]
geezipx-core = { version = "0.1.0", path = "crates/core" }
